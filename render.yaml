services:
  - type: web
    name: sgac-brazlandia-fullstack
    env: node
    plan: free
    region: oregon
    
    # Comandos de Build e Start
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npx prisma generate && npm run build"
    startCommand: "cd backend && npm start"
    
    # Variáveis de Ambiente
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      
      # AQUI ESTÁ A MUDANÇA: O Render vai pedir a URL do Neon no painel
      - key: DATABASE_URL
        sync: false
      
      # Configuração Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

    autoDeploy: true

# REMOVEMOS A SEÇÃO 'databases' PARA NÃO CRIAR BANCO NO RENDER