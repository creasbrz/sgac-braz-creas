services:
  # ---------------------------------------------------
  # 1. BACKEND (API & Banco de Dados)
  # ---------------------------------------------------
  - type: web
    name: sgac-brazlandia-api
    env: node
    plan: free
    region: oregon
    
    # Comandos limpos usando os scripts da raiz ou diretos
    buildCommand: npm install && npm run build --prefix backend
    
    # Roda a migração antes de iniciar o servidor (CRUCIAL)
    startCommand: npm run db:migrate --prefix backend && npm start --prefix backend
    
    envVars:
      - key: NODE_VERSION
        value: 20.11.0 # Fixa a versão para evitar o erro do tsup
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      
      # --- INTEGRAÇÃO COM NEON DB ---
      # Você deve colar a string de conexão do Neon (postgres://...) 
      # no painel do Render após o deploy, ou definir sync: false aqui.
      - key: DATABASE_URL
        sync: false 

      # --- CLOUDINARY ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

    autoDeploy: true

  # ---------------------------------------------------
  # 2. FRONTEND (Interface React/Vite)
  # ---------------------------------------------------
  - type: static
    name: sgac-brazlandia-web
    env: static
    plan: free
    region: oregon

    # Comandos de Build do Frontend
    buildCommand: npm install && npm run build --prefix frontend
    
    # Onde o Vite gera os arquivos (normalmente 'dist' dentro da pasta frontend)
    publishDir: frontend/dist

    envVars:
      # Conecta o Frontend ao Backend automaticamente
      - key: VITE_API_URL
        fromService:
          type: web
          name: sgac-brazlandia-api
          property: url

    autoDeploy: true