services:
  - type: web
    name: sgac-brazlandia-fullstack
    env: node
    plan: free
    region: oregon
    
    # --- CORREÇÃO AQUI ---
    # Adicionamos '--include=dev' para garantir que Vite, TypeScript e Tsup sejam instalados
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npx prisma generate && npm run build"
    
    startCommand: "cd backend && npm start"
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sgac-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    
    autoDeploy: true

databases:
  - name: sgac-db
    databaseName: sgac
    user: sgac_user
    plan: free
    region: oregon
    ipAllowList: []